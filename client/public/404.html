<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - TeamTrack</title>
    <style media="screen">
      body {
        /* The app's default dark page, where white text is well over AA */
        background: #191919;
        color: white;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #message {
        text-align: center;
        max-width: 400px;
        padding: 2rem;
      }
      #message h1 {
        font-size: 6rem;
        font-weight: 700;
        margin: 0 0 1rem;
        opacity: 0.9;
      }
      #message h2 {
        font-size: 1.5rem;
        font-weight: 400;
        margin: 0 0 1rem;
      }
      #message p {
        line-height: 1.5;
        margin: 1rem 0;
      }
      #message a {
        display: inline-block;
        background: #b0e5fe;
        color: black;
        font-weight: 600;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 25px;
        margin-top: 1rem;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }
      #message a:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>Nothing is at this address. Check the link, or go to Sessions.</p>
      <a href="/sessions">Go to Sessions</a>
    </div>
  </body>
</html>
