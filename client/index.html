    <title>TeamTrack</title>
    <!--
      Apply the saved theme before the first paint so a dark theme never
      flashes white. Same parsing as ThemeContext.tsx (which stays the source
      of truth once React mounts): default dark, legacy boolean values.
    -->
    <script>
      (function () {
        var mode = 'dark';
        try {
          var saved = localStorage.getItem('teamtrack-theme');
          if (saved === 'false') mode = 'light';
          else if (saved && saved !== 'true') {
            var parsed = JSON.parse(saved);
            if (parsed === false) mode = 'light';
            else if (
              parsed === 'light' ||
              parsed === 'honeycomb' ||
              parsed === 'deepsea'
            )
              mode = parsed;
          }
        } catch (e) {
          mode = 'dark';
        }
        var classes = document.documentElement.classList;
        if (mode !== 'light') classes.add('dark');
        if (mode === 'honeycomb' || mode === 'deepsea') classes.add(mode);
      })();
    </script>
    <style>
      /*
       * Page colours per theme, for the frames before the stylesheet loads.
       * On body, not html: a background on html keeps the body's own from
       * reaching the canvas, and it then paints over the Honeycomb / Deep Sea
       * layers behind #root. `:where()` keeps these as weak as a bare `body`
       * rule, so global.css takes over once it arrives.
       */
      body {
        background: #fefefe;
      }
      :where(.dark) body {
        background: #191919;
      }
      :where(.honeycomb) body {
        background: #0a0a0a;
      }
      :where(.deepsea) body {
        background: #0a1628;
      }
    </style>
    <!--
      Fonts load without blocking render: the stylesheet is fetched as a
      print sheet and switched on when it arrives, so a network that drops
      Google Fonts still shows the app (in the fallback font stack).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Montserrat:wght@700;900&amp;family=Righteous&amp;display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Montserrat:wght@700;900&amp;family=Righteous&amp;display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
