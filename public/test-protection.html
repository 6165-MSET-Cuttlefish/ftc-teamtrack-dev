<!DOCTYPE html>
<html>
<head>
    <title>Database Protection Test</title>
</head>
<body>
    <h1>Database Protection Test</h1>
    <div id="results"></div>
    
    <script>
        // Simple test to verify database protection
        async function testDatabaseProtection() {
            const results = document.getElementById('results');
            
            try {
                // Make multiple rapid requests to test caching and rate limiting
                console.log('Testing database protection...');
                
                const requests = [];
                for (let i = 0; i < 5; i++) {
                    requests.push(fetch('/api/sessions'));
                }
                
                const responses = await Promise.all(requests);
                console.log(`Made ${responses.length} requests`);
                
                // Check response times to verify caching
                const startTime = Date.now();
                await fetch('/api/sessions');
                const firstTime = Date.now() - startTime;
                
                const startTime2 = Date.now();
                await fetch('/api/sessions');
                const secondTime = Date.now() - startTime2;
                
                results.innerHTML = `
                    <p>✅ Database protection test completed</p>
                    <p>First request: ${firstTime}ms</p>
                    <p>Cached request: ${secondTime}ms</p>
                    <p>Speed improvement: ${((firstTime - secondTime) / firstTime * 100).toFixed(1)}%</p>
                `;
                
            } catch (error) {
                results.innerHTML = `<p>❌ Test failed: ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        testDatabaseProtection();
    </script>
</body>
</html>
